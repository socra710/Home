<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>우리집 홈페이지</title>
    <meta name="description" content="우리 가족의 작은 홈페이지 — 소개, 사진 갤러리, 연락처" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" href="assets/favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1 class="logo">우리집</h1>
        <nav class="nav" id="main-nav">
          <a href="#home">홈</a>
          <a href="#about">소개</a>
          <a href="#gallery">갤러리</a>
          <a href="#contact">연락</a>
        </nav>
        <button id="nav-toggle" class="nav-toggle" aria-expanded="false">☰</button>
      </div>
    </header>

    <main>
      <section id="home" class="hero">
        <div class="container hero-inner">
          <h2>우리집에 오신 걸 환영합니다</h2>
          <p>따뜻한 가족의 이야기와 추억을 함께 나누는 곳입니다.</p>
          <a class="btn" href="#about">더 알아보기</a>
        </div>
      </section>

      <section id="about" class="section">
        <div class="container">
          <h3>소개</h3>
          <p>이곳은 우리 가족의 작은 홈페이지입니다. 집에 관련된 정보, 갤러리, 연락처 등을 관리합니다.</p>
          <div class="info-grid">
            <div class="card">
              <h4>주소</h4>
              <p>예시시 예시구 예시동 123-4</p>
            </div>
            <div class="card">
              <h4>가족</h4>
              <p>부모님, 두 자녀, 반려견 한 마리</p>
            </div>
            <div class="card">
              <h4>전화</h4>
              <p>010-1234-5678</p>
            </div>
          </div>
        </div>
      </section>

      <section id="gallery" class="section">
        <div class="container">
          <h3>갤러리</h3>
          <div class="gallery-grid">
            <figure>
              <img src="assets/sample1.svg" alt="샘플 이미지 1" />
              <figcaption>우리집 정원</figcaption>
            </figure>
            <figure>
              <img src="assets/sample2.svg" alt="샘플 이미지 2" />
              <figcaption>가족사진</figcaption>
            </figure>
            <figure>
              <img src="assets/sample3.svg" alt="샘플 이미지 3" />
              <figcaption>주방</figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section id="contact" class="section">
        <div class="container">
          <h3>연락</h3>
          <p>문의가 있으시면 아래 양식을 이용하세요 (목적: 예시)</p>
          <form id="contact-form" class="contact-form">
            <label>
              이름
              <input type="text" name="name" required />
            </label>
            <label>
              이메일
              <input type="email" name="email" required />
            </label>
            <label>
              메시지
              <textarea name="message" rows="4" required></textarea>
            </label>
            <button type="submit" class="btn">보내기</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 우리집 · 모든 권리 보유</p>
      </div>
    </footer>

    <script src="scripts/script.js"></script>
  </body>
  </html>
