    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Map modal -->
    <div id="map-modal" class="map-modal" aria-hidden="true">
      <div class="map-modal-inner">
        <button id="map-close" class="map-close" aria-label="닫기">✕</button>
        <div id="map" style="height:400px;"></div>
        <div id="map-message" class="map-message" aria-live="polite"></div>
      </div>
    </div>

    <!-- Image modal -->
    <div id="image-modal" class="image-modal" aria-hidden="true">
      <div class="image-modal-inner">
        <button id="image-close" class="image-close" aria-label="이미지 닫기">✕</button>
        <img id="image-modal-img" src="" alt="" />
        <div id="image-modal-caption" class="image-caption"></div>
      </div>
    </div>

    <!-- Login modal -->
    <div id="auth-modal" class="auth-modal" aria-hidden="false">
      <div class="auth-inner">
        <h2>로그인</h2>
        <p>관리자 계정으로 로그인해야 사이트에 접근할 수 있습니다.</p>
        <form id="login-form">
          <label>
            사용자명
            <input type="text" id="login-user" name="username" autocomplete="username" required />
          </label>
          <label>
            비밀번호
            <input type="password" id="login-pass" name="password" autocomplete="current-password" required />
          </label>
          <div style="display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem">
            <button type="submit" class="btn">로그인</button>
            <!-- <label style="font-size:0.9rem;color:var(--muted)"><input type="checkbox" id="remember-me" /> 션 유지세</label> -->
          </div>
          <div id="login-error" style="color:#b91c1c;margin-top:0.5rem;display:none"></div>
        </form>
        <!-- <p style="font-size:0.85rem;color:var(--muted);margin-top:0.75rem">관리자: jasper, 비밀번호: 279813</p> -->
