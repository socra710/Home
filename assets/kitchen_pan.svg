<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="100%" height="100%" fill="#fff8e6"/>
  <!-- Stove -->
  <g transform="translate(60,120)">
    <rect x="0" y="160" width="680" height="110" rx="10" fill="#d1d5db"/>
    <rect x="8" y="152" width="664" height="20" rx="6" fill="#9ca3af"/>
    <circle cx="160" cy="200" r="44" fill="#0f172a"/>
    <circle cx="400" cy="200" r="44" fill="#0f172a"/>
  </g>
  <!-- Frying pan on left burner -->
  <g transform="translate(150,110)">
    <ellipse cx="10" cy="160" rx="18" ry="6" fill="#1f2937" opacity="0.4"/>
    <ellipse cx="10" cy="160" rx="70" ry="20" fill="#111827"/>
    <circle cx="10" cy="160" r="10" fill="#cbd5e1"/>
    <rect x="70" y="150" width="120" height="18" rx="6" fill="#374151" transform="rotate(-20 130 159)"/>
  </g>
  <!-- Pan contents -->
  <g transform="translate(150,120)">
    <circle cx="-5" cy="140" r="30" fill="#f59e0b"/>
    <ellipse cx="-5" cy="155" rx="22" ry="8" fill="#eab308" opacity="0.9"/>
  </g>
  <text x="18" y="420" font-size="18" fill="#374151">주방 — 가스레인지에 후라이팬 (예시 이미지)</text>
</svg>
