<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보건실 - 우리집</title>
    <meta name="description" content="보건실 - 학급 보건 기록" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" href="assets/favicon.svg" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1 class="logo">우리집 - 보건실</h1>
        <a class="btn" href="index.html">뒤로</a>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h3>학급 보건 기록</h3>
        
        <!-- Classroom-style table for multiple entries -->
        <div class="class-table-wrapper card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
            <h4 style="margin:0">보건 기록 관리</h4>
            <button id="add-row" class="btn primary">행 추가</button>
          </div>
          <div style="overflow-x:auto;border:1px solid #e6e9ef;border-radius:6px;background:#fff">
            <table id="class-table" style="width:100%;border-collapse:collapse">
              <thead>
                <tr>
                  <th style="border:1px solid #e6e9ef;padding:10px;width:8rem;text-align:left;background:#f9fafb;font-weight:600">학년 반</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;width:10rem;text-align:left;background:#f9fafb;font-weight:600">이름</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;min-width:12rem;text-align:left;background:#f9fafb;font-weight:600">아픈 위치</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;min-width:12rem;text-align:left;background:#f9fafb;font-weight:600">처치방법</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;min-width:15rem;text-align:left;background:#f9fafb;font-weight:600">기타</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;width:7rem;text-align:center;background:#f9fafb;font-weight:600">작업</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="class-table-actions" style="display:flex;gap:0.5rem;margin-top:0.75rem;justify-content:flex-end">
            <button id="save-table" class="btn primary">저장</button>
          </div>
        </div>

        <!-- Datalists for combobox autocomplete -->
        <datalist id="grade-list"></datalist>
        <datalist id="name-list"></datalist>
        <datalist id="injury-list"></datalist>
        <datalist id="treatment-list"></datalist>
      </div>
    </main>

    <script src="scripts/health.js"></script>
  </body>
</html>
