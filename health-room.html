<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>보건실 - 우리집</title>
    <meta name="description" content="보건실 - 학급 보건 기록" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="icon" href="assets/favicon.svg" />
    <style>
      .combobox-dropdown::-webkit-scrollbar { display: none; }
      .combobox-dropdown { scrollbar-width: none; -ms-overflow-style: none; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1 class="logo">우리집 - 보건실</h1>
        <a class="btn" href="index.html">뒤로</a>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <h3>학급 보건 기록</h3>
        
        <!-- Classroom-style table for multiple entries -->
        <div class="class-table-wrapper card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
            <h4 style="margin:0">보건 기록 관리</h4>
            <div>
              <button id="add-row" class="btn primary">표 추가</button>
              <button id="save-table" class="btn primary">저장</button>
            </div>
          </div>
          <div style="min-height:500px;overflow-x:auto;border:1px solid #e6e9ef;border-radius:6px;background:#fff">
            <table id="class-table" style="width:100%;border-collapse:collapse">
              <thead>
                <tr>
                  <th style="border:1px solid #e6e9ef;padding:10px;width:8rem;text-align:left;background:#f9fafb;font-weight:600">학년 반</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;width:10rem;text-align:left;background:#f9fafb;font-weight:600">이름</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;min-width:12rem;text-align:left;background:#f9fafb;font-weight:600">아픈 위치</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;min-width:12rem;text-align:left;background:#f9fafb;font-weight:600">처치방법</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;min-width:15rem;text-align:left;background:#f9fafb;font-weight:600">기타</th>
                  <th style="border:1px solid #e6e9ef;padding:10px;width:7rem;text-align:center;background:#f9fafb;font-weight:600">작업</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Datalists for combobox autocomplete -->
        <datalist id="grade-list"></datalist>
        <datalist id="name-list"></datalist>
        <datalist id="injury-list"></datalist>
        <datalist id="treatment-list"></datalist>
      </div>
    </main>

    <!-- 저장 프로그레스 모달 -->
    <div id="save-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
      <div style="background:white;padding:2rem;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.2);min-width:320px;text-align:center">
        <h3 style="margin-top:0;margin-bottom:1.5rem;color:#1f2937">저장 중...</h3>
        <div style="background:#e5e7eb;height:24px;border-radius:12px;overflow:hidden;position:relative">
          <div id="progress-bar" style="background:linear-gradient(90deg, #10b981, #34d399);height:100%;width:0%;transition:width 50ms linear;border-radius:12px"></div>
        </div>
        <p style="margin-top:1rem;margin-bottom:0;color:#6b7280;font-size:0.9rem">잠시만 기다려주세요</p>
      </div>
    </div>

    <script src="scripts/health.js"></script>
  </body>
</html>
